<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>파일 이름 검사 FN-01~10</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;background:#fff;color:#17150F}
h1{font-size:20px}#sum{font-size:18px;font-weight:800;padding:10px 14px;border-radius:10px}.ok{background:#E3F6E8;color:#14532D}.ng{background:#FDE2E2;color:#7F1D1D}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;vertical-align:top;word-break:break-all}code{font-size:12px}</style></head>
<body><h1>저장 파일 이름 고정 검사 (FN-01~FN-10)</h1><div id="sum"></div>
<table><thead><tr><th>결과</th><th>ID</th><th>검사</th><th>기대값 / 실제값</th></tr></thead><tbody id="rows"></tbody></table>
<script src="filename.js"></script><script src="tests/fn-tests.js"></script>
<script>
let pass = 0; const rows = document.getElementById('rows');
for (const t of FN_TESTS) {
  let got; try { got = ZzalFileName.makeFileName(t.input); } catch (e) { got = 'ERROR: ' + e.message; }
  const ok = got === t.expect; if (ok) pass++;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><b style="color:${ok ? '#15803D' : '#B91C1C'}">${ok ? 'PASS' : 'FAIL'}</b></td><td>${t.id}</td><td>${t.name}</td><td><code></code><br><code></code></td>`;
  const c = tr.querySelectorAll('code'); c[0].textContent = '기대: ' + t.expect; c[1].textContent = '실제: ' + got;
  rows.appendChild(tr);
}
const s = document.getElementById('sum'); s.textContent = `통과 ${pass}/${FN_TESTS.length}`; s.className = pass === FN_TESTS.length ? 'ok' : 'ng';
</script></body></html>
